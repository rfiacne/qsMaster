# Securities QA Agent — CI Pipeline
# Runs on push to master and pull requests

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
          pip install bandit safety

      - name: Security lint with bandit (SAST)
        run: |
          bandit src/ -r -q --skip=B101,B311,B303

      - name: Vulnerability scan with safety
        run: |
          safety check -r requirements.txt --ignore=70612,71064,72302,72714,72715,72716,73046,73474,73475,73476,75644,76563,77552
        continue-on-error: true  # safety false positives are common; triage manually

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/qa/ --ignore-missing-imports

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run contract tests
        run: |
          pytest tests/contract/ -v --tb=short

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short --timeout=60

      - name: Install Playwright for frontend tests
        run: |
          pip install pytest-playwright
          playwright install chromium --with-deps

      - name: Start backend server for frontend tests
        run: |
          python -m qa.api.main &
          echo $! > server.pid
          sleep 5
          curl -f http://localhost:8001/api/v1/qa/health || exit 1

      - name: Run frontend smoke tests
        run: |
          pytest tests/frontend/test_smoke.py -v --tb=short

      - name: Stop backend server
        if: always()
        run: |
          kill $(cat server.pid) || true
          rm -f server.pid

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t securities-qa-agent:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          docker run -d --name qa-test -p 8001:8001 securities-qa-agent:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8001/api/v1/qa/health || exit 1
          docker stop qa-test
          docker rm qa-test
