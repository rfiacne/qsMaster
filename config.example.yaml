# ~/.qa/config.yaml
# Securities QA Agent 配置文件
#
# API 密钥配置方式（任选其一，直接值优先级最高）:
#   方式 A: 在下面直接写 api_key: "sk-xxx"
#   方式 B: 设置环境变量，在下面写 api_key_env: "环境变量名"
#   方式 C: 不写，openai 库会自动读 OPENAI_API_KEY 环境变量

llm:
  api_base_url: "http://internal-llm:8000/v1"
  model: "gpt-4"
  # api_key: "sk-your-key-here"       # ← 方式 A: 直接填
  api_key_env: "INTERNAL_API_KEY"      # ← 方式 B: 从环境变量读取
  timeout_seconds: 30

embedding:
  backend: "auto"                      # auto(远程→本地fallback) | api(仅远程) | local(仅本地)
  api_base_url: "http://internal-llm:8000/v1"
  model: "bge-m3"
  dimensions: 1024
  # api_key: "sk-your-key-here"       # ← 可单独设，不设则用 LLM 的 key
  api_key_env: ""
  timeout_seconds: 30

vector_store:
  type: "turbovec"
  bit_width: 4
  similarity_function: "cosine"
  persist_path: "./data/index"

retrieval:
  top_k: 5
  auto_merge_threshold: 0.5
  min_score: 0.01          # 检索结果最低分数（RRF 分数通常 0.005-0.05，过低才丢弃）
  use_hybrid: true          # 使用混合检索（BM25 + 向量）
  hybrid_vector_weight: 0.5 # 向量检索权重 (0-1)，剩余为 BM25 权重
  rrf_k: 35                 # M6: RRF 融合常数，越小排序区分度越大
  block_sizes:
    - 500
    - 100

indexing:
  batch_size: 100
  ocr_enabled: false
  ocr_backend: auto          # auto | docling | opendataloader | paddle | none
  doc_timeout_seconds: 120             # 单文档转换超时（秒，OCR/PaddleOCR 首次加载模型较慢）

# ── M7: 文件去重 ────────────────────────────────────────
# 上传时自动计算文件 MD5，跳过已索引的重复文件
# 无需配置，自动生效。重复文件记录在 API 响应的 skipped_files 字段

rerank:
  enabled: true                 # M6: 默认启用 Reranker 精排（cross-encoder 二次打分）
  api_base_url: ""              # 空则复用 embedding.api_base_url
  api_key: ""                   # 空则复用 embedding 或 llm 的 key
  api_key_env: ""
  model: "Qwen/Qwen3-Reranker-4B"
  top_k: 5

server:
  host: "127.0.0.1"       # 监听地址，0.0.0.0 允许局域网访问
  port: 8001               # 服务端口
  reload: false            # 开发模式自动重启
  api_keys: []             # M4: API 密钥列表（空=不鉴权，逗号分隔或 YAML 数组）
  rate_limit_rpm: 60       # M4: 每分钟请求限制（per API key，0=不限）
  allowed_origins:         # M4: CORS 允许的来源列表
    - "http://localhost:8001"

# ── M2: Early Exit 标准答案库 ───────────────────────────
early_exit:
  enabled: true               # 启用标准答案库快速匹配
  fuzzy_threshold: 0.82       # 语义模糊匹配相似度阈值 (0~1)
  store_path: "./data/standard_answers"  # 标准答案库存储路径

# ── M2: Faithfulness 防幻觉校验 ────────────────────────
faithfulness:
  enabled: true               # 启用 LLM 生成后自动校验
  mode: "llm"                 # 校验模式: llm | disabled
  threshold: 0.7              # M6: 通过阈值（从 0.5 提升至 0.7）
  max_claims: 10              # 每次最多校验的声明数
  judge_model: ""             # M6: 校验用独立模型名（空则复用 LLM 主模型）
  judge_api_base_url: ""      # M6: 校验用独立 API 地址（空则复用 LLM 主地址）

# ── M2: PostgreSQL 全文检索 ─────────────────────────────
pg:
  enabled: false              # 启用 PG 替换内存 BM25（需 PostgreSQL 实例）
  host: "localhost"
  port: 5432
  dbname: "qa"
  user: "qa"
  password: ""                # 建议用环境变量 QA_PG_PASSWORD
  min_conn: 1
  max_conn: 5

# ── M4: OpenTelemetry 可观测性 ──────────────────────────
otel:
  enabled: false              # 启用 OpenTelemetry 链路追踪
  endpoint: ""                # OTLP HTTP 端点（如 http://otel-collector:4318）
  service_name: "securities-qa-agent"

# ── M6: 查询改写 ────────────────────────────────────────
query_rewrite:
  enabled: true               # 启用查询改写（术语归一化 + 多意图分解）
  model: ""                   # 改写用模型（空则复用 LLM 主模型）
  timeout_seconds: 3.0        # LLM 改写调用超时（秒）
  term_map_path: "./data/term_map.json"  # 术语映射表路径（证券简称→全称）

# ── M6: 查询缓存 ────────────────────────────────────────
query_cache:
  enabled: true               # 启用查询级 LRU 缓存
  max_size: 256               # LRU 缓存最大条目数
  ttl_seconds: 300            # 缓存 TTL（秒，默认 5 分钟）
