# Securities QA Agent — Docker Compose
# Usage:
#   docker compose up -d        # Start in background
#   docker compose logs -f      # Follow logs
#   docker compose down         # Stop and remove

services:
  qa-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securities-qa-agent
    ports:
      - "8001:8001"
    volumes:
      # Persist data outside container
      - qa-data:/app/data
      # Mount config file (optional, for customization)
      # - ./config.yaml:/app/config.yaml:ro
    environment:
      # LLM API
      - QA_LLM_API_BASE_URL=${QA_LLM_API_BASE_URL:-http://internal-llm:8000/v1}
      - QA_LLM_API_KEY=${QA_LLM_API_KEY:-}
      - QA_LLM_MODEL=${QA_LLM_MODEL:-gpt-4}
      # Embedding API
      - QA_EMBEDDING_API_BASE_URL=${QA_EMBEDDING_API_BASE_URL:-http://internal-llm:8000/v1}
      - QA_EMBEDDING_API_KEY=${QA_EMBEDDING_API_KEY:-}
      # Server
      - QA_SERVER_HOST=0.0.0.0
      - QA_SERVER_PORT=8001
      - QA_SERVER_API_KEYS=${QA_SERVER_API_KEYS:-}
      - QA_SERVER_RATE_LIMIT_RPM=${QA_SERVER_RATE_LIMIT_RPM:-60}
      - QA_SERVER_ALLOWED_ORIGINS=${QA_SERVER_ALLOWED_ORIGINS:-http://localhost:8001}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8001/api/v1/qa/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  qa-data:
    driver: local
