[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securities-qa-agent"
version = "0.1.0"
description = "证券清算与技术知识问答系统 (Securities QA Agent)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Securities QA Team" },
]

dependencies = [
    "haystack-ai>=2.0.0",
    "turbovec[haystack]>=0.2.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "openai>=1.6.0",
    "rich>=13.0.0",
    "docling>=2.0.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "rank-bm25>=0.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
ocr = [
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.7.0",
]
pdf = [
    "opendataloader-pdf>=0.1.0",
]
local = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]

[project.scripts]
qa = "qa.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qa"]

[tool.hatch.metadata]
allow-direct-references = true

# requirements.txt 与 pyproject.toml 同步维护，
# 用于 pip install -r requirements.txt 传统安装方式。

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
